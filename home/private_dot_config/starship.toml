# --- p10k look --------------------------------------------------------------
[fill]
symbol = " "

[directory]
style = "153"
repo_root_style = "bold 81"
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "48"

[git_status]
format = "$all_status$ahead_behind"
conflicted = "[~$count ](204)"
staged = "[+$count ](227)"
modified = "[!$count ](227)"
deleted = "[!$count ](227)"
renamed = "[!$count ](227)"
untracked = "[?$count ](39)"
stashed = "[*$count ](244)"
ahead = "[⇡$count ](48)"
behind = "[⇣$count ](48)"
diverged = "[⇡$ahead_count⇣$behind_count ](48)"

[character]
success_symbol = "[❯](206)"
error_symbol = "[❯](203)"
vimcmd_symbol = "[❮](206)"
vimcmd_replace_symbol = "[▶](206)"
vimcmd_replace_one_symbol = "[▶](206)"
vimcmd_visual_symbol = "[V](206)"

[status]
disabled = false
format = "[✘$status]($style) "
style = "203"

[azure]
disabled = false

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "101"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"
style = "66"
